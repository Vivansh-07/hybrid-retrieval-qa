# Default experiment configuration: BEIR / SciFact
dataset:
  name: scifact
  hf_id: BeIR/scifact          # corpus + queries on the HuggingFace Hub
  split: test                  # SciFact test split: 300 claims
  max_docs: null               # null = full corpus (5183 abstracts)

chunking:
  strategy: sentence_window    # one of: none | sentence_window
  window_sentences: 3          # sentences per chunk
  stride_sentences: 2          # overlap = window - stride
  min_chars: 120               # drop chunks shorter than this

sparse:
  method: bm25
  k1: 0.9                      # BEIR-standard Anserini defaults
  b: 0.4
  top_k: 100
  lowercase: true
  remove_stopwords: true
  stem: true                   # Porter stemmer

dense:
  model: sentence-transformers/all-MiniLM-L6-v2
  # stronger alternative if VRAM allows: BAAI/bge-small-en-v1.5
  query_prefix: ""             # bge models want "Represent this sentence for searching relevant passages: "
  batch_size: 128
  max_seq_length: 256
  normalize: true              # cosine == inner product once normalized
  top_k: 100
  index: flat_ip               # exact search; corpus is small enough

fusion:
  method: rrf
  k: 60                        # RRF smoothing constant (Cormack et al., 2009)
  weights: [1.0, 1.0]          # [sparse, dense]
  top_k: 100

rerank:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  batch_size: 64
  max_length: 512
  candidates: 50               # rerank depth: how many fused candidates get scored
  top_k: 10

answer:
  enabled: true
  mode: generative             # one of: extractive | generative
  generative_model: google/flan-t5-base
  extractive_model: deepset/roberta-base-squad2
  n_passages: 5                # passages placed in the prompt
  max_new_tokens: 128
  dtype: float32               # reader weights: float32 | bfloat16 (half the memory; for large readers on a 4 GB GPU)

evaluation:
  k_values: [1, 3, 5, 10, 20, 100]
  primary_k: 10
  seed: 42

paths:
  data_dir: data
  index_dir: data/indexes
  results_dir: results
