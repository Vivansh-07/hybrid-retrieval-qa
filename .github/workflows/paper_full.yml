# Builds the full-length paper (paper_full/main.tex, APA references with biber) into a
# PDF on GitHub's machines whenever it changes, and reports its page count.
# The PDF and the log are attached to the run as the "paper_full" artifact:
#   gh run download <run id> -n paper_full
name: paper_full

on:
  pull_request:
    paths: ["paper_full/**", "paper/figures/**", ".github/workflows/paper_full.yml"]
  push:
    branches: [main]
    paths: ["paper_full/**", "paper/figures/**", ".github/workflows/paper_full.yml"]
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Compile with latexmk (pdflatex + biber)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper_full

      - name: Page count and warnings
        if: always()
        run: |
          pages=$(grep -ao "/Type */Page[^s]" paper_full/main.pdf | wc -l)
          echo "pages: $pages"
          echo "### Full paper: $pages pages" >> "$GITHUB_STEP_SUMMARY"
          grep -E "LaTeX Warning|Overfull|Underfull|undefined|Biber" paper_full/main.log | sort | uniq -c | sort -rn | head -40 || true

      # Overleaf's free plan compiles one chapter at a time (\onlychapter in main.tex).
      # Check that this still builds, with the longest chapter, Results.
      - name: Make a one-chapter version (\onlychapter = 05_results)
        run: |
          sed 's/onlychapter}{}/onlychapter}{05_results}/' paper_full/main.tex > paper_full/main_onechapter.tex
          grep -c 'onlychapter}{05_results}' paper_full/main_onechapter.tex

      # latexmk -time reports the processing time of each run: first the build from scratch,
      # then a recompile after an edit to the chapter, which is what each Recompile in Overleaf does.
      - name: Compile the one-chapter version (with timings)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main_onechapter.tex
          working_directory: paper_full
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode -time
          post_compile: touch sections/05_results.tex && latexmk -pdf -interaction=nonstopmode -time main_onechapter.tex

      - name: One-chapter page count
        run: |
          pages=$(grep -ao "/Type */Page[^s]" paper_full/main_onechapter.pdf | wc -l)
          echo "pages: $pages"
          echo "### One chapter (Results) on its own: $pages pages" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper_full
          path: |
            paper_full/main.pdf
            paper_full/main.log
            paper_full/main_onechapter.pdf
            paper_full/main_onechapter.log
